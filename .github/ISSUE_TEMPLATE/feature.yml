name: Возможность
description: Предложение для игры, создания персонажей или работы с каталогом
title: "[Идея] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: Игровой сценарий
      description: Что вы хотите сделать и что сейчас мешает?
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Ожидаемый результат
      description: Как будет понятно, что задача решена?
    validations:
      required: true
